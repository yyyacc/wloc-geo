#!homepage=https://github.com/yyyacc/wloc-geo

[rewrite_local]
^https?:\/\/gs-loc(-cn)?\.apple\.com\/clls\/wloc url script-response-body https://raw.githubusercontent.com/yyyacc/wloc-geo/refs/heads/main/dist/wloc.js?v=20260721-1
